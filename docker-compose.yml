services:
  mongo:
    container_name: mongo
    image: mongo:4.2
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: job-offers
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  mongo-express:
    image: mongo-express
    restart: always  #restart the container regardless of the exit status
    ports:
      - "8081:8081"  # port forwarding
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/?authSource=admin # mongodb://{mongo-image-username}:{mongo-image-password}@{mongo-image-name}:{port}
      ME_CONFIG_BASICAUTH_USERNAME: express
      ME_CONFIG_BASICAUTH_PASSWORD: express
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"

  redis:
    image: redis:8.8.2
    ports:
      - "63792:6379"
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8082:8081"
  joboffers:
    container_name: joboffers
    build: .
    #image: 241765568072.dkr.ecr.eu-central-1.amazonaws.com/joboffers:latest
    restart: always
    ports:
      - "8000:8080"
    environment:
      MONGO_USER: root
      MONGO_PASSWORD: example
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB_NAME: joboffers
      MONGO_AUTH_SOURCE: admin
    depends_on:
      - redis
      - mongo



