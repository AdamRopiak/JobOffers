spring:
  redis:
    host: redis
    port: 6379
  cache:
    type: redis
    redis:
      time-to-live: PT1M
  application:
    name: joboffers
  data:
    mongodb:
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_NAME}?authSource=${MONGO_AUTH_SOURCE}
      auto-index-creation: true

joboffers:
  jobfetcher:
    http:
      client:
        config:
          uri: https://fake-java-offers-api.onrender.com
          connectionTimeOut: 5000
          readTimeOut: 5000
    scheduler:
      joboffers:
        delay: PT3H
scheduling:
  enabled: true
auth:
  jwt:
    expirationDays: 30
    secret: "asdadadafw923052175v1hnpavhn7845vn5anv"
    issuer: JobOfferBacked