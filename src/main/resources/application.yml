spring:
  application:
    name: joboffers
  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/job-offers

joboffers:
  jobfetcher:
    http:
      client:
        config:
          uri: http://ec2-18-194-181-208.eu-central-1.compute.amazonaws.com
          port: 5057
          connectionTimeOut: 5000
          readTimeOut: 5000
    scheduler:
      joboffers:
        delay: "0 0 23 * * *"
